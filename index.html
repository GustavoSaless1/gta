<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Bangers&family=Dancing+Script:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <meta name="description" content="Explore personagens inspirados em GTA e transforme sua foto com inteligência artificial. Projeto de portfólio de Gustavo Sales com HTML, CSS e JavaScript.">
    <title>GTA · Seu personagem com IA | Gustavo Sales</title>

</head>

<body>
    <p class="nome">Lucia</p>

    <img class="personagem" src="assets/img/lucia.png" alt="Personagem Lucia">

    <div class="textos">
        <p class="etiqueta">Selecione o seu personagem</p>
        <h1>Não é só <br> um jogo</h1>
        <p class="texto-apoio">Escolha uma lenda de Dev City. Ou tire uma Selfie e vire uma.</p>
    </div>


    <div class="menu">
        <img onclick="escolherPersonagem('lucia', 'assets/img/lucia.png', '#ff3cac')" class="avatar" src="assets/img/lucia.png" alt="Lucia">
        <img onclick="escolherPersonagem('jason', 'assets/img/jason.png', '#00b2c9')" class="avatar" src="assets/img/jason.png" alt="Jason">
        <img onclick="escolherPersonagem('cj', 'assets/img/cj.png', '#7ed37e')" class="avatar" src="assets/img/cj.png" alt="CJ">
        <div class="seu-personagem">
            <button class="voce" type="button" aria-label="Criar meu personagem" title="Criar meu personagem" onclick="mostrarMeuPersonagem()">
                <svg class="icone-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 5 9.5 3h5L16 5h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/>
                    <circle cx="12" cy="12.5" r="4"/>
                    <path d="M17.5 8h.01"/>
                </svg>
                <img class="miniatura-voce" alt="Seu personagem gerado" hidden>
            </button>
            <button class="gerar-outra" type="button" hidden onclick="gerarOutraImagem()">Gerar outra foto</button>
        </div>
        <input id="foto" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="lerFoto(this)">
    </div>
    <p class="status-foto" role="status" aria-live="polite"></p>

<script src="https://js.puter.com/v2/"></script>
<script src="assets/js/scripts.js"></script>
</body>
</html>
